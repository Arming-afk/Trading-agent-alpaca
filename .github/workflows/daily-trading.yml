name: daily trading run

on:
  schedule:
    # 14:00 UTC = 10:00 ET — half an hour after the open, so opening auctions
    # have settled and option quotes are real rather than overnight stubs.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and log, submit nothing"
        type: boolean
        default: true
      force:
        description: "Run even when the market is closed (selection only)"
        type: boolean
        default: false

# Never let two runs trade at once, and never cancel one that is mid-submission.
concurrency:
  group: daily-trading
  cancel-in-progress: false

permissions:
  contents: write        # the run commits its own decision log

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Alpaca CLI
        run: |
          ./scripts/install_cli.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify CLI and credentials
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          alpaca account get --jq '.status' --quiet
          alpaca clock --quiet

      - name: Run the agent
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # Scheduled runs trade. A manual dispatch defaults to dry-run so the
          # workflow can be smoke-tested without touching the account.
          TRADING_ENABLED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          python scripts/daily_run.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Commit the day's records
        run: |
          git config user.name  "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add logs/
          if git diff --staged --quiet; then
            echo "no new records"
            exit 0
          fi
          git commit -m "chore(logs): run $(date -u +%Y-%m-%d) [bot]"
          # Rebase before pushing: a manual dispatch and the cron can land close
          # together, and losing a day's record to a rejected push is worse than
          # a retry.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep $((i * 5))
          done
          echo "could not push records after 3 attempts" >&2
          exit 1
